<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 505" role="img" aria-label="실험 전에 세 축의 기준을 정하고 비교 명세와 적용 범위 및 결정문을 연결하는 TRI-V">
<rect width="720" height="505" fill="#FFFFFF"/>
<g font-family="ReaderSans,sans-serif" fill="#142D32">
<text x="16" y="35" font-size="26" font-weight="700">TRI-V: 같은 기록으로 연결하는 세 축</text>
<rect x="16" y="55" width="688" height="79" rx="3" fill="#F2F5F1"/>
<text x="30" y="85" font-size="23" font-weight="700">실험 전 공통 기준</text>
<text x="30" y="115" font-size="21">비교와 고객군, 사업과 보호, 책임을 함께 정한다</text>
<text x="16" y="178" font-size="24" font-weight="700">V1 Variable Control</text>
<text x="375" y="174" font-size="24" font-weight="700">비교 명세</text>
<text x="375" y="205" font-size="21">분모, 관측 창과 측정 경로</text>
<text x="16" y="266" font-size="24" font-weight="700">V2 Vector Segmentation</text>
<text x="375" y="262" font-size="24" font-weight="700">적용 범위 문장</text>
<text x="375" y="293" font-size="21">현재 대상과 다음 대상의 차이</text>
<text x="16" y="354" font-size="24" font-weight="700">V3 Value-Linked Decision</text>
<text x="375" y="350" font-size="24" font-weight="700">결정문</text>
<text x="375" y="381" font-size="21">선택, 책임과 재검토 조건</text>
<g font-size="21" fill="#4F625F"><text x="16" y="432">최소 경로도 세 질문을 확인한다. 심화 분석은 필요할 때 연다.</text>
<text x="16" y="464">근거가 비면 앞 단계로 돌아가고, 기준 변경은 이력에 남긴다.</text>
<text x="16" y="495">검토 결과와 실제 실행 승인은 구분한다.</text></g>
</g><path d="M16 222H704 M16 310H704 M16 398H704" fill="none" stroke="#9CAEA6"/>
</svg>
