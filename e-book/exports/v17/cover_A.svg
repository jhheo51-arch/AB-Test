<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1280" viewBox="0 0 900 1280" role="img" aria-labelledby="title desc" font-family="ReaderSans,Noto Sans KR,sans-serif"><title id="title">그래서, 이 캠페인 계속할까요? — 대화형 표지안</title><desc id="desc">차이를 대칭으로 강조한 표지 비유. 실제 고객 집합의 중복이나 인과 효과를 나타내는 집합도가 아니다. A와 B의 우열을 색으로 미리 정하지 않는다.</desc><rect width="900" height="1280" fill="#F5F1E8"/><text x="66" y="88" font-size="25" font-weight="600" fill="#142D32" >CRM A/B 테스트 실무서</text><path d="M96 140 H804 Q842 140 842 178 V539 Q842 577 804 577 H258 L180 638 L190 577 H96 Q58 577 58 539 V178 Q58 140 96 140 Z" fill="#FAE9DD"/><text x="95" y="260" font-size="91" font-weight="800" fill="#142D32" >그래서,</text><text x="95" y="375" font-size="91" font-weight="800" fill="#142D32" >이 캠페인</text><text x="95" y="490" font-size="91" font-weight="800" fill="#142D32" >계속할까요?</text><text x="70" y="708" font-size="30" font-weight="650" fill="#142D32" >숫자에서 고객과 실행의 판단까지</text><defs><clipPath id="cover-right"><circle cx="559" cy="908" r="149"/></clipPath></defs><circle cx="340" cy="908" r="149" fill="#E3EEE8"/><circle cx="559" cy="908" r="149" fill="#FAE9DD"/><circle cx="340" cy="908" r="149" fill="#F5F1E8" clip-path="url(#cover-right)"/><circle cx="340" cy="908" r="149" fill="none" stroke="#125E59" stroke-width="3"/><circle cx="559" cy="908" r="149" fill="none" stroke="#125E59" stroke-width="3"/><text x="305" y="949" font-size="110" font-weight="650" fill="#125E59" >A</text><text x="526" y="949" font-size="110" font-weight="650" fill="#125E59" >B</text><text x="70" y="1123" font-size="26" font-weight="750" fill="#125E59" >TRI-V</text><text x="178" y="1123" font-size="24" font-weight="500" fill="#4F625F" >판단을 위한 저자의 방법론</text><text x="66" y="1204" font-size="26" font-weight="650" fill="#142D32" >허재혁 지음</text><text x="834" y="1204" font-size="20" font-weight="500" fill="#4F625F" text-anchor="end">저자 검토본 0.17</text></svg>