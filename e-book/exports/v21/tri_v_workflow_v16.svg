<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" role="img" aria-label="현재 선택에서 세 축과 되돌림 및 승인 구분까지" font-family="ReaderSans,sans-serif"><rect width="900" height="670" fill="white"/><defs><marker id="wf-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#125E59"/></marker></defs><rect x="28" y="20" width="844" height="76" rx="25" fill="#F5F1E8" stroke="#125E59"/><text x="51" y="67" font-size="31" font-weight="700" fill="#142D32">먼저 정할 것: 무엇을 비교하고 어디까지 선택할까?</text><rect x="28" y="132" width="248" height="264" rx="23" fill="#E3EEE8" stroke="#125E59"/><text x="41" y="174" font-size="28" font-weight="700" fill="#142D32">V1 정화</text><text x="41" y="218" font-size="28" font-weight="500" fill="#142D32">비교와 측정</text><text x="41" y="262" font-size="28" font-weight="500" fill="#142D32">해석 가능</text><text x="41" y="306" font-size="28" font-weight="500" fill="#142D32">일부 지표 제한</text><text x="41" y="350" font-size="28" font-weight="500" fill="#142D32">비교 보류</text><rect x="326" y="132" width="248" height="264" rx="23" fill="#E3EEE8" stroke="#125E59"/><text x="339" y="174" font-size="28" font-weight="700" fill="#142D32">V2</text><text x="339" y="218" font-size="28" font-weight="500" fill="#142D32">해체와 입체화</text><text x="339" y="262" font-size="28" font-weight="500" fill="#142D32">적용 범위</text><text x="339" y="306" font-size="28" font-weight="500" fill="#142D32">전체부터 확인</text><text x="339" y="350" font-size="28" font-weight="500" fill="#142D32">필요할 때만 세분화</text><rect x="624" y="132" width="248" height="264" rx="23" fill="#FAE9DD" stroke="#125E59"/><text x="637" y="174" font-size="28" font-weight="700" fill="#142D32">V3 언어의 전환</text><text x="637" y="218" font-size="28" font-weight="500" fill="#142D32">성과 / 사업 / 보호</text><text x="637" y="262" font-size="28" font-weight="500" fill="#142D32">현재 선택</text><text x="637" y="306" font-size="28" font-weight="500" fill="#142D32">승인과 책임</text><text x="637" y="350" font-size="28" font-weight="500" fill="#142D32">다음 확인</text><path d="M280 262H316" stroke="#125E59" stroke-width="3" marker-end="url(#wf-arrow)"/><path d="M578 262H614" stroke="#125E59" stroke-width="3" marker-end="url(#wf-arrow)"/><path d="M748 401V436H150V402 M450 436V402" fill="none" stroke="#125E59" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#wf-arrow)"/><text x="155" y="480" font-size="28" font-weight="500" fill="#142D32">선택을 바꾸는 근거가 비면 해당 질문으로 돌아간다</text><rect x="28" y="506" width="190" height="48" rx="22" fill="#F5F1E8" stroke="#125E59"/><text x="46" y="539" font-size="28" font-weight="650" fill="#142D32">실행 후보</text><rect x="246" y="506" width="190" height="48" rx="22" fill="#F5F1E8" stroke="#125E59"/><text x="264" y="539" font-size="28" font-weight="650" fill="#142D32">추가 확인</text><rect x="464" y="506" width="190" height="48" rx="22" fill="#F5F1E8" stroke="#125E59"/><text x="482" y="539" font-size="28" font-weight="650" fill="#142D32">미확대</text><rect x="682" y="506" width="190" height="48" rx="22" fill="#F5F1E8" stroke="#125E59"/><text x="700" y="539" font-size="28" font-weight="650" fill="#142D32">보호 대응</text><text x="29" y="598" font-size="28" font-weight="700" fill="#8D4029">실행 후보 ≠ 실제 승인</text><text x="29" y="637" font-size="28" font-weight="600" fill="#8D4029">추가 분석 종료, 통계적 실험 종료, 보호 운영 중단은 다르다</text></svg>