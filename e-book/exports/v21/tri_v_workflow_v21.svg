<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 600" role="img" font-family="ReaderSans,sans-serif"><title>TRI-V: 비교 조건에서 선택과 다음 확인까지</title><desc>학습용 개념도이며 실측 데이터가 아니다.</desc><rect width="840" height="600" fill="white"/><text x="420" y="40" text-anchor="middle" font-size="31" font-weight="700" fill="#142D32">무엇을 비교하고, 어디까지 결정할까?</text><rect x="30" y="74" width="780" height="114" rx="8" fill="#E3EEE8" stroke="#BAC9C1"/><text x="58" y="123" text-anchor="start" font-size="27" font-weight="700" fill="#125E59" data-region="[44, 86, 752, 90]">01</text><text x="114" y="123" text-anchor="start" font-size="29" font-weight="700" fill="#142D32" data-region="[44, 86, 752, 90]">정화</text><text x="114" y="168" text-anchor="start" font-size="26" font-weight="500" fill="#4F625F" data-region="[44, 86, 752, 90]">비교와 측정</text><path d="M358 92L358 170" fill="none" stroke="#125E59" stroke-width="2"/><text x="386" y="123" text-anchor="start" font-size="26" font-weight="500" fill="#142D32" data-region="[44, 86, 752, 90]">비교를 유지할 수 있는가?</text><text x="386" y="168" text-anchor="start" font-size="26" font-weight="500" fill="#142D32" data-region="[44, 86, 752, 90]">해석 가능 / 지표 제한 / 비교 보류</text><path d="M420 188L420 204" fill="none" stroke="#125E59" stroke-width="2"/><path d="M414 198L420 205L426 198" fill="none" stroke="#125E59" stroke-width="2"/><rect x="30" y="210" width="780" height="114" rx="8" fill="#E3EEE8" stroke="#BAC9C1"/><text x="58" y="259" text-anchor="start" font-size="27" font-weight="700" fill="#125E59" data-region="[44, 222, 752, 90]">02</text><text x="114" y="259" text-anchor="start" font-size="29" font-weight="700" fill="#142D32" data-region="[44, 222, 752, 90]">해체와 입체화</text><text x="114" y="304" text-anchor="start" font-size="26" font-weight="500" fill="#4F625F" data-region="[44, 222, 752, 90]">고객과 적용 범위</text><path d="M358 228L358 306" fill="none" stroke="#125E59" stroke-width="2"/><text x="386" y="259" text-anchor="start" font-size="26" font-weight="500" fill="#142D32" data-region="[44, 222, 752, 90]">전체의 답을 누구에게 적용할까?</text><text x="386" y="304" text-anchor="start" font-size="26" font-weight="500" fill="#142D32" data-region="[44, 222, 752, 90]">전체부터 읽고 필요할 때만 나눈다</text><path d="M420 324L420 340" fill="none" stroke="#125E59" stroke-width="2"/><path d="M414 334L420 341L426 334" fill="none" stroke="#125E59" stroke-width="2"/><rect x="30" y="346" width="780" height="114" rx="8" fill="#FAE9DD" stroke="#BAC9C1"/><text x="58" y="395" text-anchor="start" font-size="27" font-weight="700" fill="#125E59" data-region="[44, 358, 752, 90]">03</text><text x="114" y="395" text-anchor="start" font-size="29" font-weight="700" fill="#142D32" data-region="[44, 358, 752, 90]">언어의 전환</text><text x="114" y="440" text-anchor="start" font-size="26" font-weight="500" fill="#4F625F" data-region="[44, 358, 752, 90]">사업과 보호의 선택</text><path d="M358 364L358 442" fill="none" stroke="#125E59" stroke-width="2"/><text x="386" y="395" text-anchor="start" font-size="26" font-weight="500" fill="#142D32" data-region="[44, 358, 752, 90]">지금 무엇을 선택할 수 있는가?</text><text x="386" y="440" text-anchor="start" font-size="26" font-weight="500" fill="#142D32" data-region="[44, 358, 752, 90]">선택과 다음 확인을 기록한다</text><text x="420" y="502" text-anchor="middle" font-size="27" font-weight="500" fill="#142D32">근거가 비면 해당 질문으로 돌아간다</text><text x="420" y="544" text-anchor="middle" font-size="28" font-weight="700" fill="#8D4029">실행 후보는 실제 승인이 아니다</text><text x="420" y="582" text-anchor="middle" font-size="26" font-weight="500" fill="#4F625F">분석 종료, 실험 종료, 보호 운영 중단은 구별한다</text></svg>