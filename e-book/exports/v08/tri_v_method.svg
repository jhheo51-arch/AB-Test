<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 336" role="img" aria-label="맥락항법를 실행하는 TRI-V: 정화, 해체와 입체화, 언어의 전환. 필요하면 앞선 단계로 돌아간다."><rect width="720" height="336" fill="white"/><g fill="#162B33" font-family="Malgun Gothic,sans-serif"><text x="22" y="32" font-size="24">맥락항법를 실행하는 세 단계</text><text x="22" y="84" font-size="22">정화</text><text x="260" y="84" font-size="20" fill="#125E59">Variable Control</text><text x="22" y="116" font-size="19">무엇을 비교했고, 같은 방식으로 관측했는가</text><text x="22" y="166" font-size="22">해체와 입체화</text><text x="260" y="166" font-size="20" fill="#125E59">Vector Segmentation</text><text x="22" y="198" font-size="19">전체와 고객별 차이는 어디에서 생겼는가</text><text x="22" y="248" font-size="22">언어의 전환</text><text x="260" y="248" font-size="20" fill="#125E59">Value-Linked Decision</text><text x="22" y="280" font-size="19">비용과 위험을 고려하면 무엇을 선택할 것인가</text><text x="22" y="326" font-size="18" fill="#526168">비교나 운영의 문제가 드러나면 앞선 단계로 돌아가 다시 설계한다.</text></g><path d="M22 132 H680 M22 214 H680" stroke="#526168" stroke-width=".6"/></svg>