<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="decision_record_v16-title decision_record_v16-desc" viewBox="0 0 900 840" width="900" height="840">
<title id="decision_record_v16-title">기존 여섯 칸 기록의 연결</title><desc id="decision_record_v16-desc">같은 실험 식별자 아래 지금 결정할 것, V1 근거와 제한, V2 적용 대상, V3 현재 선택과 승인 상태, 추가 확인 또는 생략, 다시 검토할 조건을 연결한다. 새 양식이나 일곱 번째 칸이 아니다. 모든 도형과 태그는 개념 설명이며 실제 관측 데이터가 아니다.</desc>
<defs><marker id="decision_record_v16-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#125E59" /></marker></defs>
<rect width="900" height="840" fill="#FFFFFF" />
<g font-family="ReaderSans,Noto Sans KR,sans-serif"><text x="36" y="44" font-size="36" font-weight="700" fill="#142D32">기존 여섯 칸으로 판단을 잇는다</text><text x="36" y="82" font-size="28" font-weight="400" fill="#4F625F">개념 설명 | 실제 고객이나 성과 데이터가 아님</text><rect x="92" y="116" width="756" height="84" rx="22" fill="#E3EEE8" stroke="#125E59" stroke-width="2" /><text x="116" y="151" font-size="30" font-weight="700" fill="#142D32">지금 결정할 것</text><text x="116" y="185" font-size="28" font-weight="400" fill="#142D32">가능한 선택과 범위</text><path d="M470 200V217" fill="none" stroke="#125E59" stroke-width="3" marker-end="url(#decision_record_v16-arrow)" /><rect x="92" y="220" width="756" height="84" rx="22" fill="#E3EEE8" stroke="#125E59" stroke-width="2" /><text x="116" y="255" font-size="30" font-weight="700" fill="#142D32">V1 믿고 쓸 근거와 제한</text><text x="116" y="289" font-size="28" font-weight="400" fill="#142D32">결과 위치와 제한할 주장</text><path d="M470 304V321" fill="none" stroke="#125E59" stroke-width="3" marker-end="url(#decision_record_v16-arrow)" /><rect x="92" y="324" width="756" height="84" rx="22" fill="#E3EEE8" stroke="#125E59" stroke-width="2" /><text x="116" y="359" font-size="30" font-weight="700" fill="#142D32">V2 적용 대상</text><text x="116" y="393" font-size="28" font-weight="400" fill="#142D32">같은 대상인지, 다른 근거인지</text><path d="M470 408V425" fill="none" stroke="#125E59" stroke-width="3" marker-end="url(#decision_record_v16-arrow)" /><rect x="92" y="428" width="756" height="84" rx="22" fill="#F5F1E8" stroke="#125E59" stroke-width="2" /><text x="116" y="463" font-size="30" font-weight="700" fill="#142D32">V3 현재 선택</text><text x="116" y="497" font-size="28" font-weight="400" fill="#142D32">선택과 실제 승인 상태 구분</text><path d="M470 512V529" fill="none" stroke="#125E59" stroke-width="3" marker-end="url(#decision_record_v16-arrow)" /><rect x="92" y="532" width="756" height="84" rx="22" fill="#F5F1E8" stroke="#125E59" stroke-width="2" /><text x="116" y="567" font-size="30" font-weight="700" fill="#142D32">추가 확인 또는 생략</text><text x="116" y="601" font-size="28" font-weight="400" fill="#142D32">행동을 바꿀 질문과 책임</text><path d="M470 616V633" fill="none" stroke="#125E59" stroke-width="3" marker-end="url(#decision_record_v16-arrow)" /><rect x="92" y="636" width="756" height="84" rx="22" fill="#F5F1E8" stroke="#125E59" stroke-width="2" /><text x="116" y="671" font-size="30" font-weight="700" fill="#142D32">다시 검토할 조건</text><text x="116" y="705" font-size="28" font-weight="400" fill="#142D32">관측이나 가정이 바뀌는 때</text><path d="M92 678H46V157H88" fill="none" stroke="#125E59" stroke-width="3" marker-end="url(#decision_record_v16-arrow)" stroke-dasharray="8 7" /><text x="92" y="777" font-size="28" font-weight="700" fill="#142D32">같은 실험 식별자로 기존 계획과 결과를 참조</text><text x="92" y="818" font-size="28" font-weight="400" fill="#4F625F">여섯 칸의 연결 설명이며 새 작성 양식이 아님</text></g></svg>