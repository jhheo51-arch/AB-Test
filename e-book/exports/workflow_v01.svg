<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 550" role="img" aria-label="G0부터 G8까지의 CRM 판단 흐름과 보류·재설계 분기"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#526168"/></marker></defs><g fill="none" stroke="#526168" stroke-width="2" marker-end="url(#arrow)"><path d="M220,64 L250,64"/><path d="M450,64 L480,64"/><path d="M580,108 L580,170"/><path d="M480,214 L450,214"/><path d="M250,214 L220,214"/><path d="M120,258 L120,320"/><path d="M220,364 L250,364"/><path d="M450,364 L480,364"/><path d="M580,408 L580,464"/><path d="M250,494 L120,494 L120,420" stroke-dasharray="5 5"/></g><g class="node" data-step="0" tabindex="0" role="button" aria-label="G0 질문·안전" aria-pressed="false"><rect x="20" y="20" width="200" height="88" rx="3" fill="#FFFFFF" stroke="#125E59" stroke-width="1.5"/><text x="34" y="43" font-size="12" fill="#125E59" font-family="Malgun Gothic,sans-serif">G0</text><text x="34" y="68" font-size="18" font-weight="700" fill="#162B33" font-family="Malgun Gothic,sans-serif">질문·안전</text><text x="34" y="90" font-size="11" fill="#526168" font-family="Malgun Gothic,sans-serif">허용되는 질문인가?</text></g><g class="node" data-step="1" tabindex="0" role="button" aria-label="G1 비교·실행" aria-pressed="false"><rect x="250" y="20" width="200" height="88" rx="3" fill="#FFFFFF" stroke="#125E59" stroke-width="1.5"/><text x="264" y="43" font-size="12" fill="#125E59" font-family="Malgun Gothic,sans-serif">G1</text><text x="264" y="68" font-size="18" font-weight="700" fill="#162B33" font-family="Malgun Gothic,sans-serif">비교·실행</text><text x="264" y="90" font-size="11" fill="#526168" font-family="Malgun Gothic,sans-serif">효과를 식별할 수 있는가?</text></g><g class="node" data-step="2" tabindex="0" role="button" aria-label="G2 데이터 품질" aria-pressed="false"><rect x="480" y="20" width="200" height="88" rx="3" fill="#FFFFFF" stroke="#125E59" stroke-width="1.5"/><text x="494" y="43" font-size="12" fill="#125E59" font-family="Malgun Gothic,sans-serif">G2</text><text x="494" y="68" font-size="18" font-weight="700" fill="#162B33" font-family="Malgun Gothic,sans-serif">데이터 품질</text><text x="494" y="90" font-size="11" fill="#526168" font-family="Malgun Gothic,sans-serif">무엇이 관측됐는가?</text></g><g class="node" data-step="3" tabindex="0" role="button" aria-label="G3 기간·정보" aria-pressed="false"><rect x="480" y="170" width="200" height="88" rx="3" fill="#FFFFFF" stroke="#125E59" stroke-width="1.5"/><text x="494" y="193" font-size="12" fill="#125E59" font-family="Malgun Gothic,sans-serif">G3</text><text x="494" y="218" font-size="18" font-weight="700" fill="#162B33" font-family="Malgun Gothic,sans-serif">기간·정보</text><text x="494" y="240" font-size="11" fill="#526168" font-family="Malgun Gothic,sans-serif">판단할 만큼 성숙했는가?</text></g><g class="node" data-step="4" tabindex="0" role="button" aria-label="G4 효과·불확실성" aria-pressed="false"><rect x="250" y="170" width="200" height="88" rx="3" fill="#FFFFFF" stroke="#125E59" stroke-width="1.5"/><text x="264" y="193" font-size="12" fill="#125E59" font-family="Malgun Gothic,sans-serif">G4</text><text x="264" y="218" font-size="18" font-weight="700" fill="#162B33" font-family="Malgun Gothic,sans-serif">효과·불확실성</text><text x="264" y="240" font-size="11" fill="#526168" font-family="Malgun Gothic,sans-serif">어느 크기의 차이인가?</text></g><g class="node" data-step="5" tabindex="0" role="button" aria-label="G5 상충 패턴" aria-pressed="false"><rect x="20" y="170" width="200" height="88" rx="3" fill="#FFFFFF" stroke="#125E59" stroke-width="1.5"/><text x="34" y="193" font-size="12" fill="#125E59" font-family="Malgun Gothic,sans-serif">G5</text><text x="34" y="218" font-size="18" font-weight="700" fill="#162B33" font-family="Malgun Gothic,sans-serif">상충 패턴</text><text x="34" y="240" font-size="11" fill="#526168" font-family="Malgun Gothic,sans-serif">어디서 엇갈리는가?</text></g><g class="node" data-step="6" tabindex="0" role="button" aria-label="G6 집단·전이" aria-pressed="false"><rect x="20" y="320" width="200" height="88" rx="3" fill="#FFFFFF" stroke="#125E59" stroke-width="1.5"/><text x="34" y="343" font-size="12" fill="#125E59" font-family="Malgun Gothic,sans-serif">G6</text><text x="34" y="368" font-size="18" font-weight="700" fill="#162B33" font-family="Malgun Gothic,sans-serif">집단·전이</text><text x="34" y="390" font-size="11" fill="#526168" font-family="Malgun Gothic,sans-serif">누구에게도 같은가?</text></g><g class="node" data-step="7" tabindex="0" role="button" aria-label="G7 가치·제약" aria-pressed="false"><rect x="250" y="320" width="200" height="88" rx="3" fill="#FFFFFF" stroke="#125E59" stroke-width="1.5"/><text x="264" y="343" font-size="12" fill="#125E59" font-family="Malgun Gothic,sans-serif">G7</text><text x="264" y="368" font-size="18" font-weight="700" fill="#162B33" font-family="Malgun Gothic,sans-serif">가치·제약</text><text x="264" y="390" font-size="11" fill="#526168" font-family="Malgun Gothic,sans-serif">사업과 관계에 유효한가?</text></g><g class="node" data-step="8" tabindex="0" role="button" aria-label="G8 승인·재평가" aria-pressed="false"><rect x="480" y="320" width="200" height="88" rx="3" fill="#FFFFFF" stroke="#125E59" stroke-width="1.5"/><text x="494" y="343" font-size="12" fill="#125E59" font-family="Malgun Gothic,sans-serif">G8</text><text x="494" y="368" font-size="18" font-weight="700" fill="#162B33" font-family="Malgun Gothic,sans-serif">승인·재평가</text><text x="494" y="390" font-size="11" fill="#526168" font-family="Malgun Gothic,sans-serif">어떤 조건에서 행동할까?</text></g><rect x="250" y="464" width="430" height="60" rx="3" fill="#F6F4EF" stroke="#526168" stroke-dasharray="5 4"/><text x="270" y="489" font-size="16" fill="#162B33" font-family="Malgun Gothic,sans-serif">미해결 문제 → 보류·재설계</text><text x="270" y="511" font-size="12" fill="#526168" font-family="Malgun Gothic,sans-serif">각 단계에서 진입 가능 · 근거가 생기면 해당 단계 재검토</text></svg>