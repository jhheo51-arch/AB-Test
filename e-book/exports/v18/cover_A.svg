<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1280" role="img" font-family="ReaderSans,sans-serif"><title>그래서, 이 캠페인 계속할까요?</title><desc>동일한 비교틀의 가치 안내 A와 편의 안내 B. 표지는 비유이며 실제 발송 실적을 나타내지 않는다.</desc><rect width="900" height="1280" fill="#F5F1E8"/><text x="76" y="98" font-size="26" font-weight="600" fill="#142D32" text-anchor="start">CRM A/B 테스트 실무서</text><path d="M76 130H824" stroke="#125E59" stroke-width="2"/><text x="70" y="268" font-size="91" font-weight="800" fill="#142D32" text-anchor="start">그래서,</text><text x="70" y="410" font-size="91" font-weight="800" fill="#142D32" text-anchor="start">이 캠페인</text><text x="70" y="552" font-size="91" font-weight="800" fill="#142D32" text-anchor="start">계속할까요?</text><path d="M76 584H634" stroke="#125E59" stroke-width="5"/><text x="76" y="650" font-size="32" font-weight="600" fill="#142D32" text-anchor="start">차이를 읽고, 실행할 범위를 정하는 법</text><rect x="76" y="720" width="358" height="222" rx="8" fill="white" stroke="#BAC9C1" stroke-width="2"/><text x="104" y="775" font-size="40" font-weight="700" fill="#125E59" text-anchor="start">A</text><text x="104" y="843" font-size="32" font-weight="700" fill="#142D32" text-anchor="start">차량 가치 안내</text><text x="104" y="897" font-size="25" font-weight="500" fill="#4F625F" text-anchor="start">차량의 장점을 전한다</text><rect x="466" y="720" width="358" height="222" rx="8" fill="white" stroke="#BAC9C1" stroke-width="2"/><text x="494" y="775" font-size="40" font-weight="700" fill="#125E59" text-anchor="start">B</text><text x="494" y="843" font-size="32" font-weight="700" fill="#142D32" text-anchor="start">시승 편의 안내</text><text x="494" y="897" font-size="25" font-weight="500" fill="#4F625F" text-anchor="start">예약을 편하게 돕는다</text><text x="76" y="1030" font-size="27" font-weight="500" fill="#142D32" text-anchor="start">같은 조건에서 비교하고, 다른 결과를 읽습니다</text><text x="76" y="1103" font-size="32" font-weight="750" fill="#125E59" text-anchor="start">TRI-V</text><text x="232" y="1103" font-size="25" font-weight="500" fill="#4F625F" text-anchor="start">근거와 선택을 연결하는 저자의 방법론</text><text x="76" y="1200" font-size="27" font-weight="650" fill="#142D32" text-anchor="start">허재혁 지음</text><text x="824" y="1200" font-size="22" font-weight="500" fill="#4F625F" text-anchor="end">저자 검토본0.18</text></svg>