<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 447.40860748291016" role="img" font-family="ReaderSans,sans-serif"><title>모집이 끝나도 관측은 계속된다</title><desc>학습용 개념도이며 실측 데이터가 아니다.</desc><rect width="840" height="440" fill="white"></rect><text x="420" y="40" text-anchor="middle" font-size="31" font-weight="700" fill="#142D32">모집 종료와 결과 확정을 따로 적는다</text><path d="M180 120L780 120" fill="none" stroke="#125E59" stroke-width="2"></path><path d="M480 108L480 344" fill="none" stroke="#125E59" stroke-width="2" stroke-dasharray="7 5"></path><text x="480" y="92" text-anchor="middle" font-size="27" font-weight="700" fill="#125E59">모집 종료</text><text x="30" y="181" text-anchor="start" font-size="28" font-weight="700" fill="#142D32">먼저 배정</text><rect x="190" y="154" width="380" height="34" rx="4" fill="#E3EEE8"></rect><text x="190" y="236" text-anchor="middle" font-size="26" font-weight="500" fill="#142D32">배정</text><text x="570" y="236" text-anchor="middle" font-size="26" font-weight="500" fill="#142D32">관측 창 종료</text><text x="30" y="287" text-anchor="start" font-size="28" font-weight="700" fill="#142D32">나중 배정</text><rect x="350" y="260" width="380" height="34" rx="4" fill="#E3EEE8"></rect><text x="350" y="342" text-anchor="middle" font-size="26" font-weight="500" fill="#142D32">배정</text><text x="730" y="342" text-anchor="middle" font-size="26" font-weight="500" fill="#142D32">관측 창 종료</text><text x="420" y="392" text-anchor="middle" font-size="28" font-weight="700" fill="#142D32">마지막 고객도 정한 기간을 채워야 한다</text><text x="420" y="430" text-anchor="middle" font-size="26" font-weight="500" fill="#4F625F">기간과 길이는 개념 설명이며 실제 날짜가 아니다</text></svg>