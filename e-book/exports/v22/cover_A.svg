<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1280" role="img" font-family="ReaderSans,sans-serif"><title>그래서, 이 캠페인 계속할까요?</title><desc>CRM A/B 테스트 실무. TRI-V로 근거를 점검하고 적용 범위와 다음 행동을 정하는 법. 허재혁 지음.</desc><rect width="900" height="1280" fill="#F5F1E8"/><text x="74" y="125" font-size="48" font-weight="750" fill="#125E59" text-anchor="start">CRM A/B 테스트 실무</text><text x="76" y="185" font-size="27" font-weight="500" fill="#4F625F" text-anchor="start">자동차 CRM 사례로 배우는 실험과 판단</text><path d="M76 228H824" stroke="#125E59" stroke-width="2"/><text x="70" y="378" font-size="84" font-weight="800" fill="#142D32" text-anchor="start">그래서, 이 캠페인</text><text x="70" y="550" font-size="104" font-weight="800" fill="#142D32" text-anchor="start">계속할까요?</text><text x="76" y="642" font-size="34" font-weight="600" fill="#142D32" text-anchor="start">TRI-V로 근거를 점검하고</text><text x="76" y="697" font-size="34" font-weight="600" fill="#142D32" text-anchor="start">적용 범위와 다음 행동을 정하는 법</text><text x="72" y="922" font-size="92" font-weight="750" fill="#125E59" text-anchor="start">TRI-V</text><text x="76" y="999" font-size="30" font-weight="500" fill="#4F625F" text-anchor="start">근거  /  적용 범위  /  다음 행동</text><path d="M76 1080H824" stroke="#125E59" stroke-width="2"/><text x="76" y="1190" font-size="32" font-weight="650" fill="#142D32" text-anchor="start">허재혁 지음</text><text x="824" y="1190" font-size="22" font-weight="500" fill="#4F625F" text-anchor="end">저자 검토본 0.22</text></svg>