<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1280" viewBox="0 0 900 1280" role="img" aria-labelledby="title desc" font-family="ReaderSans,Noto Sans KR,sans-serif"><title id="title">그래서, 이 캠페인 계속할까요? — 편집노트형 표지안</title><desc id="desc">밑줄과 제본선, 노트의 짜임이 판단과 기록이라는 독서 경험을 전한다.</desc><rect width="900" height="1280" fill="#FAE9DD"/><rect x="34" y="49" width="832" height="1124" rx="8" fill="#F5F1E8" stroke="#142D32" stroke-width="2"/><path d="M95 72 L95 1153" fill="none" stroke="#8D4029" stroke-width="2" stroke-linecap="round"/><path d="M22 130 C8 112 8 98 34 98 H54" fill="none" stroke="#125E59" stroke-width="5" stroke-linecap="round"/><path d="M22 240 C8 222 8 208 34 208 H54" fill="none" stroke="#125E59" stroke-width="5" stroke-linecap="round"/><path d="M22 350 C8 332 8 318 34 318 H54" fill="none" stroke="#125E59" stroke-width="5" stroke-linecap="round"/><path d="M22 460 C8 442 8 428 34 428 H54" fill="none" stroke="#125E59" stroke-width="5" stroke-linecap="round"/><path d="M22 570 C8 552 8 538 34 538 H54" fill="none" stroke="#125E59" stroke-width="5" stroke-linecap="round"/><path d="M22 680 C8 662 8 648 34 648 H54" fill="none" stroke="#125E59" stroke-width="5" stroke-linecap="round"/><path d="M22 790 C8 772 8 758 34 758 H54" fill="none" stroke="#125E59" stroke-width="5" stroke-linecap="round"/><path d="M22 900 C8 882 8 868 34 868 H54" fill="none" stroke="#125E59" stroke-width="5" stroke-linecap="round"/><path d="M22 1010 C8 992 8 978 34 978 H54" fill="none" stroke="#125E59" stroke-width="5" stroke-linecap="round"/><text x="128" y="116" font-size="25" font-weight="600" fill="#142D32" >CRM A/B 테스트 실무서</text><text x="128" y="188" font-size="23" font-weight="650" fill="#8D4029" >캠페인 옆에 두는 판단 노트</text><text x="124" y="311" font-size="88" font-weight="800" fill="#142D32" >그래서,</text><text x="124" y="425" font-size="88" font-weight="800" fill="#142D32" >이 캠페인</text><text x="124" y="539" font-size="88" font-weight="800" fill="#142D32" >계속할까요?</text><path d="M127 560 Q421 543 779 560" fill="none" stroke="#8D4029" stroke-width="9" stroke-linecap="round"/><text x="130" y="624" font-size="30" font-weight="550" fill="#142D32" >숫자에서 고객과</text><text x="130" y="668" font-size="30" font-weight="550" fill="#142D32" >실행의 판단까지</text><text x="130" y="759" font-size="31" font-weight="800" fill="#125E59" >TRI-V</text><text x="249" y="759" font-size="25" font-weight="500" fill="#4F625F" >저자의 방법론</text><path d="M130 791 L792 791" fill="none" stroke="#4F625F" stroke-width="1" stroke-linecap="round"/><text x="130" y="842" font-size="31" font-weight="750" fill="#142D32" >정화</text><text x="375" y="842" font-size="25" font-weight="500" fill="#4F625F" >비교의 조건을 살피고</text><text x="130" y="917" font-size="31" font-weight="750" fill="#142D32" >해체와 입체화</text><text x="375" y="917" font-size="25" font-weight="500" fill="#4F625F" >고객의 차이를 읽고</text><text x="130" y="992" font-size="31" font-weight="750" fill="#142D32" >언어의 전환</text><text x="375" y="992" font-size="25" font-weight="500" fill="#4F625F" >실행의 말로 바꾼다</text><text x="140" y="1102" font-size="25" font-weight="650" fill="#125E59" >질문을 남기고, 판단을 기록하다</text><text x="68" y="1204" font-size="26" font-weight="650" fill="#142D32" >허재혁 지음</text><text x="834" y="1204" font-size="20" font-weight="500" fill="#4F625F" text-anchor="end">저자 검토본 0.16</text></svg>