<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1280" viewBox="0 0 900 1280" role="img" aria-labelledby="title desc" font-family="ReaderSans,Noto Sans KR,sans-serif"><title id="title">그래서, 이 캠페인 계속할까요? — 경로지도형 표지안</title><desc id="desc">정화, 해체와 입체화, 언어의 전환의 세 경로가 다음 실행으로 모이는 개념 지도. 실측 그래프가 아니다.</desc><rect width="900" height="1280" fill="#F5F1E8"/><text x="66" y="88" font-size="25" font-weight="600" fill="#142D32" >CRM A/B 테스트 실무서</text><path d="M66 120 L834 120" fill="none" stroke="#125E59" stroke-width="2" stroke-linecap="round"/><text x="65" y="247" font-size="96" font-weight="800" fill="#142D32" >그래서,</text><text x="65" y="366" font-size="96" font-weight="800" fill="#142D32" >이 캠페인</text><text x="65" y="485" font-size="96" font-weight="800" fill="#142D32" >계속할까요?</text><text x="70" y="568" font-size="30" font-weight="550" fill="#142D32" >숫자에서 고객과 실행의 판단까지</text><text x="70" y="655" font-size="31" font-weight="750" fill="#125E59" >TRI-V</text><text x="188" y="655" font-size="25" font-weight="500" fill="#4F625F" >판단을 위한 세 갈래의 길</text><path d="M89 713 V1013 M89 737 H159 M89 871 H159 M89 1005 H159" fill="none" stroke="#125E59" stroke-width="5" stroke-linecap="round"/><path d="M161 737 H724 Q780 737 780 1062" fill="none" stroke="#125E59" stroke-width="5" stroke-linecap="round"/><circle cx="161" cy="737" r="10" fill="#F5F1E8" stroke="#125E59" stroke-width="4"/><text x="190" y="715" font-size="31" font-weight="750" fill="#142D32" >정화</text><text x="190" y="779" font-size="24" font-weight="500" fill="#4F625F" >무엇을 비교할 수 있는가</text><path d="M161 871 H724 Q780 871 780 1062" fill="none" stroke="#125E59" stroke-width="5" stroke-linecap="round"/><circle cx="161" cy="871" r="10" fill="#F5F1E8" stroke="#125E59" stroke-width="4"/><text x="190" y="849" font-size="31" font-weight="750" fill="#142D32" >해체와 입체화</text><text x="190" y="913" font-size="24" font-weight="500" fill="#4F625F" >누구에게 어떤 차이인가</text><path d="M161 1005 H724 Q780 1005 780 1062" fill="none" stroke="#125E59" stroke-width="5" stroke-linecap="round"/><circle cx="161" cy="1005" r="10" fill="#F5F1E8" stroke="#125E59" stroke-width="4"/><text x="190" y="983" font-size="31" font-weight="750" fill="#142D32" >언어의 전환</text><text x="190" y="1047" font-size="24" font-weight="500" fill="#4F625F" >그래서 무엇을 할 것인가</text><rect x="639" y="1084" width="194" height="57" rx="28" fill="#125E59"/><text x="736" y="1123" font-size="26" font-weight="650" fill="#F5F1E8" text-anchor="middle">다음 실행</text><path d="M780 1062 V1084" stroke="#125E59" stroke-width="5"/><text x="66" y="1204" font-size="26" font-weight="650" fill="#142D32" >허재혁 지음</text><text x="834" y="1204" font-size="20" font-weight="500" fill="#4F625F" text-anchor="end">저자 검토본 0.16</text></svg>