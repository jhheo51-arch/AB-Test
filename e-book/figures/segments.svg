<svg xmlns="http://www.w3.org/2000/svg" width="900" height="680" viewBox="0 0 900 680" role="img" aria-labelledby="segments-title segments-desc" font-family="ReaderSans, sans-serif">
<title id="segments--segments-title">전체 평균의 개선이 기존 고객의 개선은 아니다</title><desc id="segments--segments-desc">완료율 차이 B-A pp. 전체 +2.33 [1.07,3.59], 95% 층화 Wald. 신규 +7.93 [6.12,9.75], 기존 -3.27 [-5.51,-1.02], 각 97.5% Newcombe. 동일 축과 네이비 점 및 구간을 사용한다.</desc>
