<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590" role="img" aria-labelledby="measurement-title measurement-desc" font-family="ReaderSans, sans-serif">
<title id="measurement--measurement-title">기록을 대사하면 판단이 어떻게 바뀔까?</title><desc id="measurement--measurement-desc">각 군 4,000명의 합성 실습. 동일 0~700건 축. 결함 로그 A480 B289, 원장 대사 후 A480 B630. B 완료 341건 누락. 로그 차이 -4.78pp, 원장 차이 +3.75pp. 각 95% 구간을 유지한다.</desc>
