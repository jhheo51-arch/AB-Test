<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="capacity-title capacity-desc" font-family="ReaderSans, sans-serif">
<title id="capacity--capacity-title">완료가 가장 많아도 순가치는 최대가 아니다</title><desc id="capacity--capacity-desc">하루 60슬롯, 28일, 같은 12,000명 수요의 조건부 모형. A 전면 완료997 순가치1984.5만원 미수용0%, B10% A90% 완료1100 순가치2154.0만원 미수용0%, B 전면 완료1486 순가치1889.1만원 미수용27.05%. 완료 최대와 순가치 최대를 텍스트로 구분한다. 미수용률 0~30% 축, 보호 기준 10%.</desc>
<rect width="900" height="100%" fill="#FFFFFF"/>
<text x="24" y="44" font-size="32" fill="#1F1F1F" font-weight="700" text-anchor="start">완료가 가장 많아도 순가치는 최대가 아니다</text>
<text x="24" y="88" font-size="25" fill="#595959" font-weight="500" text-anchor="start">하루 60슬롯 / 28일, 같은 12,000명 수요의 조건부 모형</text>
<text x="24" y="146" font-size="26" fill="#1F1F1F" font-weight="700" text-anchor="start">정책</text>
<text x="390" y="146" font-size="26" fill="#1F1F1F" font-weight="700" text-anchor="start">완료 (건)</text>
<text x="864" y="146" font-size="26" fill="#1F1F1F" font-weight="700" text-anchor="end">순가치 (만원)</text>
<line x1="24" y1="163" x2="876" y2="163" stroke="#A8AFB8" stroke-width="1" />
<text x="24" y="207" font-size="26" fill="#1F1F1F" font-weight="700" text-anchor="start">A 전면</text>
<text x="390" y="207" font-size="26" fill="#1F1F1F" font-weight="500" text-anchor="start">997</text>
<text x="864" y="207" font-size="26" fill="#1F1F1F" font-weight="500" text-anchor="end">1,984.5</text>
<text x="24" y="259" font-size="26" fill="#1F1F1F" font-weight="700" text-anchor="start">B 10%, A 90%</text>
<text x="390" y="259" font-size="26" fill="#1F1F1F" font-weight="500" text-anchor="start">1,100</text>
<text x="864" y="259" font-size="26" fill="#002C5F" font-weight="700" text-anchor="end">2,154.0 순가치 최대</text>
<text x="24" y="311" font-size="26" fill="#1F1F1F" font-weight="700" text-anchor="start">B 전면</text>
<text x="390" y="311" font-size="26" fill="#1F1F1F" font-weight="700" text-anchor="start">1,486 완료 최대</text>
<text x="864" y="311" font-size="26" fill="#1F1F1F" font-weight="500" text-anchor="end">1,889.1</text>
<line x1="24" y1="333" x2="876" y2="333" stroke="#A8AFB8" stroke-width="1" />
<text x="24" y="375" font-size="28" fill="#1F1F1F" font-weight="700" text-anchor="start">미수용률 (%)</text>
<line x1="300.0" y1="400" x2="300.0" y2="543" stroke="#1F1F1F" stroke-width="2" />
<text x="300.0" y="579" font-size="25" fill="#1F1F1F" font-weight="500" text-anchor="middle">0%</text>
<line x1="450.0" y1="400" x2="450.0" y2="543" stroke="#A8AFB8" stroke-width="1" />
<text x="450.0" y="579" font-size="25" fill="#1F1F1F" font-weight="500" text-anchor="middle">10%</text>
<line x1="600.0" y1="400" x2="600.0" y2="543" stroke="#A8AFB8" stroke-width="1" />
<text x="600.0" y="579" font-size="25" fill="#1F1F1F" font-weight="500" text-anchor="middle">20%</text>
<line x1="750.0" y1="400" x2="750.0" y2="543" stroke="#A8AFB8" stroke-width="1" />
<text x="750.0" y="579" font-size="25" fill="#1F1F1F" font-weight="500" text-anchor="middle">30%</text>
<line x1="450.0" y1="400" x2="450.0" y2="543" stroke="#595959" stroke-width="1.5" stroke-dasharray="6 6" />
<text x="24" y="432" font-size="26" fill="#1F1F1F" font-weight="500" text-anchor="start">A 전면</text>
<rect id="capacity--unserved-997" data-value="0" x="300" y="407" width="0.0" height="30" fill="#727D8B"/>
<text x="864" y="432" font-size="26" fill="#1F1F1F" font-weight="500" text-anchor="end">0.00%</text>
<text x="24" y="484" font-size="26" fill="#1F1F1F" font-weight="500" text-anchor="start">B 10%, A 90%</text>
<rect id="capacity--unserved-1100" data-value="0" x="300" y="459" width="0.0" height="30" fill="#727D8B"/>
<text x="864" y="484" font-size="26" fill="#1F1F1F" font-weight="500" text-anchor="end">0.00%</text>
<text x="24" y="536" font-size="26" fill="#1F1F1F" font-weight="500" text-anchor="start">B 전면</text>
<rect id="capacity--unserved-1486" data-value="27.05" x="300" y="511" width="405.75" height="30" fill="#727D8B"/>
<text x="864" y="536" font-size="26" fill="#1F1F1F" font-weight="500" text-anchor="end">27.05%</text>
<text x="24" y="626" font-size="25" fill="#1F1F1F" font-weight="700" text-anchor="start">점선 10%는 모형의 보호 기준. B 전면은 27.05%로 넘는다</text>
</svg>