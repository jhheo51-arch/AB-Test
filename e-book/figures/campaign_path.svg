<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img" aria-label="가상 캠페인의 설계에서 결정까지"><rect width="720" height="370" fill="white"/><g font-family="ReaderSans,sans-serif" fill="#142D32"><text x="12" y="34" font-size="25" font-weight="700">한 캠페인을 끝까지 읽는 순서</text><text x="18" y="95" font-size="23">정화</text><text x="220" y="95" font-size="22">동의와 대상 → 비교 정책 → 배정과 측정</text><text x="18" y="170" font-size="23">해체와 입체화</text><text x="220" y="170" font-size="22">전체 효과 → 사전 고객군 → 적용 범위</text><text x="18" y="245" font-size="23">언어의 전환</text><text x="220" y="245" font-size="22">사업 기준 → 보호와 용량 → 조건부 결정</text><text x="18" y="337" font-size="21" fill="#4F625F">근거가 비어 있으면 앞선 단계로 돌아가 다음 자료를 정한다.</text></g><path d="M18 115H700M18 190H700M18 265H700" stroke="#9CAEA6"/></svg>