<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 550" role="img" font-family="ReaderSans,sans-serif"><title>근거와 선택을 연결하는 여섯 칸</title><desc>학습용 개념도이며 실측 데이터가 아니다.</desc><rect width="840" height="550" fill="white"/><text x="420" y="40" text-anchor="middle" font-size="31" font-weight="700" fill="#1F1F1F">새 서류보다 기존 근거를 연결하는 기록</text><rect x="30" y="70" width="380" height="126" rx="8" fill="#EAF3FC" stroke="#D9D9D9"/><text x="220" y="120" text-anchor="middle" font-size="28" font-weight="700" fill="#1F1F1F" data-region="[44, 82, 352, 102]">01  지금 결정할 것</text><text x="220" y="170" text-anchor="middle" font-size="26" font-weight="500" fill="#1F1F1F" data-region="[44, 82, 352, 102]">대안과 적용 범위</text><rect x="430" y="70" width="380" height="126" rx="8" fill="#EAF3FC" stroke="#D9D9D9"/><text x="620" y="120" text-anchor="middle" font-size="28" font-weight="700" fill="#1F1F1F" data-region="[444, 82, 352, 102]">02  V1 믿고 쓸 근거와 제한</text><text x="620" y="170" text-anchor="middle" font-size="26" font-weight="500" fill="#1F1F1F" data-region="[444, 82, 352, 102]">결과와 사용할 수 없는 근거</text><rect x="30" y="210" width="380" height="126" rx="8" fill="#EAF3FC" stroke="#D9D9D9"/><text x="220" y="260" text-anchor="middle" font-size="28" font-weight="700" fill="#1F1F1F" data-region="[44, 222, 352, 102]">03  V2 적용 대상</text><text x="220" y="310" text-anchor="middle" font-size="26" font-weight="500" fill="#1F1F1F" data-region="[44, 222, 352, 102]">배정, 분석, 적용의 차이</text><rect x="430" y="210" width="380" height="126" rx="8" fill="#FAE9DD" stroke="#D9D9D9"/><text x="620" y="260" text-anchor="middle" font-size="28" font-weight="700" fill="#1F1F1F" data-region="[444, 222, 352, 102]">04  V3 현재 선택</text><text x="620" y="310" text-anchor="middle" font-size="26" font-weight="500" fill="#1F1F1F" data-region="[444, 222, 352, 102]">보호 조건과 실제 승인 상태</text><rect x="30" y="350" width="380" height="126" rx="8" fill="#FAE9DD" stroke="#D9D9D9"/><text x="220" y="400" text-anchor="middle" font-size="28" font-weight="700" fill="#1F1F1F" data-region="[44, 362, 352, 102]">05  추가 확인 또는 생략</text><text x="220" y="450" text-anchor="middle" font-size="26" font-weight="500" fill="#1F1F1F" data-region="[44, 362, 352, 102]">선택을 바꿀 확인과 생략 이유</text><rect x="430" y="350" width="380" height="126" rx="8" fill="#EAF3FC" stroke="#D9D9D9"/><text x="620" y="400" text-anchor="middle" font-size="28" font-weight="700" fill="#1F1F1F" data-region="[444, 362, 352, 102]">06  다시 검토할 조건</text><text x="620" y="450" text-anchor="middle" font-size="26" font-weight="500" fill="#1F1F1F" data-region="[444, 362, 352, 102]">어떤 변화가 선택을 바꾸나?</text><text x="420" y="530" text-anchor="middle" font-size="26" font-weight="500" fill="#595959">계획과 분석의 원문은 링크로 재사용한다</text></svg>