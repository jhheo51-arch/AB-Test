<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" role="img" aria-labelledby="winner_effect-title winner_effect-desc" font-family="ReaderSans, sans-serif">
<title id="winner_effect--winner_effect-title">B의 완료율은 높다. 도입 기준 충족은 별개다</title><desc id="winner_effect--winner_effect-desc">합성 A/B 비교. A 1,971/21,637명 9.11%, B 2,212/22,024명 10.04%. 차이 +0.93pp, 개별 98.33% Wilson–Newcombe 구간 +0.26부터 +1.61pp. 사후 사업 문턱 +0.5pp 미만도 포함한다.</desc>
