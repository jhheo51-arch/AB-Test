<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 382.44184494018555" role="img" font-family="ReaderSans,sans-serif"><title>철회 차이가 뚜렷하지 않아도 안전 확인은 아니다</title><rect width="900" height="370" fill="white"></rect><text x="24" y="42" font-size="32" font-weight="700" fill="#1F1F1F" text-anchor="start">철회 차이가 뚜렷하지 않아도 안전 확인은 아니다</text><text x="24" y="88" font-size="26" font-weight="500" fill="#595959" text-anchor="start">철회율 차이 B-A(pp), 증가가 악화 / 개별 95% 양측 탐색 구간</text><rect x="604.0" y="124" width="216.0" height="102" rx="4" fill="#FAE9DD"></rect><line x1="172.0" y1="124" x2="172.0" y2="226" stroke="#D1D8D6" stroke-width="2"></line><text x="172.0" y="272" font-size="25" font-weight="500" fill="#1F1F1F" text-anchor="middle">-0.1</text><line x1="316.0" y1="124" x2="316.0" y2="226" stroke="#595959" stroke-width="2"></line><text x="316.0" y="272" font-size="25" font-weight="500" fill="#1F1F1F" text-anchor="middle">+0.0</text><line x1="460.0" y1="124" x2="460.0" y2="226" stroke="#D1D8D6" stroke-width="2"></line><text x="460.0" y="272" font-size="25" font-weight="500" fill="#1F1F1F" text-anchor="middle">+0.1</text><line x1="604.0" y1="124" x2="604.0" y2="226" stroke="#D1D8D6" stroke-width="2"></line><text x="604.0" y="272" font-size="25" font-weight="500" fill="#1F1F1F" text-anchor="middle">+0.2</text><line x1="747.9999999999999" y1="124" x2="747.9999999999999" y2="226" stroke="#D1D8D6" stroke-width="2"></line><text x="747.9999999999999" y="272" font-size="25" font-weight="500" fill="#1F1F1F" text-anchor="middle">+0.3</text><line x1="604.0" y1="124" x2="604.0" y2="226" stroke="#505B6A" stroke-width="2" stroke-dasharray="7 5"></line><line x1="179.27392911763155" y1="182" x2="685.3020045792706" y2="182" stroke="#002C5F" stroke-width="7"></line><circle cx="432.13778385194365" cy="182" r="7" fill="#002C5F"></circle><text x="24" y="325" font-size="26" font-weight="700" fill="#1F1F1F" text-anchor="start">추정 +0.081pp / 상한 +0.256pp는 +0.2pp를 넘는다</text><text x="24" y="365" font-size