<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="observation_maturity_v16-title observation_maturity_v16-desc" viewBox="0 0 900 650" width="900" height="650">
<title id="observation_maturity_v16-title">모집 중지와 관측 창의 성숙</title><desc id="observation_maturity_v16-desc">시간축에서 앞서 배정된 고객과 늦게 배정된 고객의 같은 길이 관측 창을 보여준다. 모집이 멈춰도 늦게 배정된 고객의 관측은 계속된다. 선의 위치와 길이는 개념 설명이며 날짜나 실제 기간이 아니다. 모든 도형과 태그는 개념 설명이며 실제 관측 데이터가 아니다.</desc>
<defs><marker id="observation_maturity_v16-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#125E59" /></marker></defs>
<rect width="900" height="650" fill="#FFFFFF" />
<g font-family="ReaderSans,Noto Sans KR,sans-serif"><text x="36" y="44" font-size="36" font-weight="700" fill="#142D32">모집을 멈춰도 관측은 이어진다</text><text x="36" y="82" font-size="28" font-weight="400" fill="#4F625F">개념 설명 | 실제 고객이나 성과 데이터가 아님</text><path d="M75 146H834" fill="none" stroke="#125E59" stroke-width="3" marker-end="url(#observation_maturity_v16-arrow)" /><text x="76" y="129" font-size="28" font-weight="700" fill="#142D32">시간의 흐름</text><path d="M540 163V464" fill="none" stroke="#125E59" stroke-width="3" stroke-dasharray="8 8" /><rect x="560" y="172" width="290" height="56" rx="22" fill="#FAE9DD" stroke="#125E59" stroke-width="2" /><text x="580" y="210" font-size="30" font-weight="700" fill="#142D32">모집 중지 시점</text><text x="76" y="251" font-size="30" font-weight="700" fill="#142D32">먼저 배정된 고객</text><rect x="90" y="280" width="360" height="52" rx="22" fill="#E3EEE8" stroke="#125E59" stroke-width="2" /><text x="112" y="316" font-size="28" font-weight="400" fill="#142D32">같은 길이의 관측 창</text><circle cx="90" cy="306" r="7" fill="#125E59" /><circle cx="450" cy="306" r="7" fill="#125E59" /><text x="468" y="316" font-size="28" font-weight="700" fill="#142D32">성숙</text><text x="76" y="371" font-size="30" font-weight="700" fill="#142D32">늦게 배정된 고객</text><rect x="360" y="400" width="360" height="52" rx="22" fill="#E3EEE8" stroke="#125E59" stroke-width="2" /><text x="382" y="436" font-size="28" font-weight="400" fill="#142D32">같은 길이의 관측 창</text><circle cx="360" cy="426" r="7" fill="#125E59" /><circle cx="720" cy="426" r="7" fill="#125E59" /><text x="738" y="436" font-size="28" font-weight="700" fill="#142D32">성숙</text><rect x="40" y="498" width="820" height="118" rx="22" fill="#F5F1E8" stroke="#125E59" stroke-width="2" /><text x="64" y="536" font-size="30" font-weight="700" fill="#142D32">늦게 들어온 고객도 정한 관측 기회를 채운다</text><text x="64" y="573" font-size="28" font-weight="400" fill="#142D32">아직 미성숙한 상태를 미완료로 확정하지 않는다</text><text x="64" y="606" font-size="28" font-weight="700" fill="#8D4029">모집 중지와 통계적 종료, 보호 대응은 별도 판단</text></g></svg>