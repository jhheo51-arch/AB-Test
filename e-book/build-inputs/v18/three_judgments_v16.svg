<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="three_judgments_v16-title three_judgments_v16-desc" viewBox="0 0 900 660" width="900" height="660">
<title id="three_judgments_v16-title">같은 결과를 읽는 서로 다른 문장</title><desc id="three_judgments_v16-desc">관측은 기록에서 본 차이를, 추론은 설계와 불확실성 아래 말할 수 있는 효과를, 사업과 보호 선택은 실행 조건과 책임을 표현한다. TRI-V에 새로운 세 축을 추가한 그림이 아니다. 모든 도형과 태그는 개념 설명이며 실제 관측 데이터가 아니다.</desc>
<defs><marker id="three_judgments_v16-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#125E59" /></marker></defs>
<rect width="900" height="660" fill="#FFFFFF" />
<g font-family="ReaderSans,Noto Sans KR,sans-serif"><text x="36" y="44" font-size="36" font-weight="700" fill="#142D32">본 것과 말할 수 있는 것, 선택할 것</text><text x="36" y="82" font-size="28" font-weight="400" fill="#4F625F">개념 설명 | 실제 고객이나 성과 데이터가 아님</text><rect x="40" y="120" width="820" height="138" rx="22" fill="#E3EEE8" stroke="#125E59" stroke-width="2" /><text x="66" y="158" font-size="32" font-weight="700" fill="#142D32">관측 문장</text><text x="66" y="199" font-size="30" font-weight="400" fill="#142D32">기록에서 본 차이를 말한다</text><text x="66" y="238" font-size="28" font-weight="400" fill="#125E59">“배정 고객의 시승 완료를 비교했다.”</text><rect x="40" y="284" width="820" height="138" rx="22" fill="#F5F1E8" stroke="#125E59" stroke-width="2" /><text x="66" y="322" font-size="32" font-weight="700" fill="#142D32">추론 문장</text><text x="66" y="363" font-size="30" font-weight="400" fill="#142D32">설계와 불확실성 아래 효과를 말한다</text><text x="66" y="402" font-size="28" font-weight="400" fill="#125E59">“어디까지 효과라고 말할 수 있을까?”</text><rect x="40" y="448" width="820" height="138" rx="22" fill="#FAE9DD" stroke="#125E59" stroke-width="2" /><text x="66" y="486" font-size="32" font-weight="700" fill="#142D32">사업과 보호 선택 문장</text><text x="66" y="527" font-size="30" font-weight="400" fill="#142D32">비용, 용량, 동의와 안전을 따로 본다</text><text x="66" y="566" font-size="28" font-weight="400" fill="#125E59">“어떤 범위와 조건으로 선택할까?”</text><path d="M450 258V279" fill="none" stroke="#125E59" stroke-width="3" marker-end="url(#three_judgments_v16-arrow)" /><path d="M450 422V443" fill="none" stroke="#125E59" stroke-width="3" marker-end="url(#three_judgments_v16-arrow)" /><text x="40" y="633" font-size="28" font-weight="700" fill="#8D4029">서로 대신할 수 없는 문장 | 실행 후보는 승인이 아님</text></g></svg>