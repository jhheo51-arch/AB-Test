<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" role="img" font-family="ReaderSans,sans-serif"><title>관측에서 통계로, 통계에서 선택으로</title><desc>학습용 개념도이며 실측 데이터가 아니다.</desc><rect width="840" height="460" fill="white"/><rect x="30" y="20" width="780" height="126" rx="8" fill="#E3EEE8" stroke="#BAC9C1"/><text x="56" y="69" text-anchor="start" font-size="29" font-weight="700" fill="#142D32" data-region="[44, 32, 752, 102]">관측</text><text x="56" y="120" text-anchor="start" font-size="27" font-weight="500" fill="#142D32" data-region="[44, 32, 752, 102]">실제로 어떤 차이가 보였나?</text><text x="774" y="92" text-anchor="end" font-size="29" font-weight="700" fill="#125E59" data-region="[44, 32, 752, 102]">01</text><rect x="30" y="164" width="780" height="126" rx="8" fill="#E3EEE8" stroke="#BAC9C1"/><text x="56" y="213" text-anchor="start" font-size="29" font-weight="700" fill="#142D32" data-region="[44, 176, 752, 102]">통계적 판단</text><text x="56" y="264" text-anchor="start" font-size="27" font-weight="500" fill="#142D32" data-region="[44, 176, 752, 102]">효과와 불확실성은 어느 정도인가?</text><text x="774" y="236" text-anchor="end" font-size="29" font-weight="700" fill="#125E59" data-region="[44, 176, 752, 102]">02</text><rect x="30" y="308" width="780" height="126" rx="8" fill="#FAE9DD" stroke="#BAC9C1"/><text x="56" y="357" text-anchor="start" font-size="29" font-weight="700" fill="#142D32" data-region="[44, 320, 752, 102]">사업과 보호 판단</text><text x="56" y="408" text-anchor="start" font-size="27" font-weight="500" fill="#142D32" data-region="[44, 320, 752, 102]">비용과 관계 위험까지 감당할 수 있나?</text><text x="774" y="380" text-anchor="end" font-size="29" font-weight="700" fill="#125E59" data-region="[44, 320, 752, 102]">03</text></svg>